command:
  - node
  - dist/mcp/mcp/index.js

env:
  - name: PORT
    value: "8000"
  - name: MCP_PUBLIC_URL
    valueFrom: mcp_public_url
  - name: NEXT_PUBLIC_SUPABASE_URL
    valueFrom: supabase_url
  - name: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    valueFrom: supabase_publishable_key
  - name: OPENAI_API_KEY
    valueFrom: openai_api_key
